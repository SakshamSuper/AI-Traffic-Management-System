version: '3.9'
services:
  postgres:
    restart: always
    ports: []
  redis:
    restart: always
    ports: []
  backend:
    restart: always
    volumes: []
    command: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    restart: always
    volumes: []
    ports: []
  nginx:
    restart: always
